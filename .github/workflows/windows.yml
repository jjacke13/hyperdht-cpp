name: Windows

on:
  push:
    # 'main' matters: without it this workflow only ran on release tags, and a
    # POSIX-only include broke every Windows build for six weeks (2026-07-11 ..
    # 2026-08-22) before a tag push surfaced it.
    branches: ['main', 'feat/windows-ci']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install -y ninja

      - name: Install libsodium via vcpkg
        shell: pwsh
        run: |
          vcpkg install --triplet=x64-windows-static-md `
            --x-manifest-root="$env:GITHUB_WORKSPACE/.github/vcpkg" `
            --x-install-root="$env:RUNNER_TEMP/vcpkg_installed"
          echo "SODIUM_PREFIX=$env:RUNNER_TEMP/vcpkg_installed/x64-windows-static-md" >> $env:GITHUB_ENV
          $header = Get-Content "$env:RUNNER_TEMP/vcpkg_installed/x64-windows-static-md/include/sodium/version.h" -Raw
          if ($header -notmatch 'SODIUM_VERSION_STRING\s+"1\.0\.22"') { throw 'unexpected libsodium version' }
          echo "VCPKG_TOOLCHAIN=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - uses: ./.github/actions/setup-libuv

      - name: Patch libudx for MSVC compatibility
        shell: bash
        run: |
          # MSVC doesn't support GCC's "X ?: Y" Elvis operator (missing middle
          # operand). Both sites read pure struct fields so duplicating the
          # expression is safe (no side effects).
          sed -i 's|stream->delivered + stream->inflight_queue.len ?: 1|(stream->delivered + stream->inflight_queue.len) ? (stream->delivered + stream->inflight_queue.len) : 1|g' deps/libudx/src/udx_rate.c
          sed -i 's|(stream->delivered + stream->inflight_queue.len) ?: 1|((stream->delivered + stream->inflight_queue.len) ? (stream->delivered + stream->inflight_queue.len) : 1)|g' deps/libudx/src/udx_bbr.c
          # Verify the patches stuck (will fail loudly if the upstream lines change)
          grep -q '?: 1' deps/libudx/src/udx_rate.c && { echo "udx_rate.c not patched"; exit 1; } || true
          grep -q '?: 1' deps/libudx/src/udx_bbr.c && { echo "udx_bbr.c not patched"; exit 1; } || true

      - name: Build static
        shell: pwsh
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DHYPERDHT_BUILD_TESTS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_TOOLCHAIN" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DVCPKG_INSTALLED_DIR="$env:RUNNER_TEMP/vcpkg_installed" `
            -Dlibuv_DIR="$env:LIBUV_PREFIX/lib/cmake/libuv"
          cmake --build build --config Release

      - name: Build shared (DLL)
        shell: pwsh
        run: |
          cmake -B build-shared -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DHYPERDHT_BUILD_TESTS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_TOOLCHAIN" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DVCPKG_INSTALLED_DIR="$env:RUNNER_TEMP/vcpkg_installed" `
            -Dlibuv_DIR="$env:LIBUV_PREFIX/lib/cmake/libuv"
          cmake --build build-shared --config Release

      - name: Package library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/lib, dist/include | Out-Null
          # Static lib: hyperdht.lib (built with /MD, no DLL)
          Copy-Item build/hyperdht.lib dist/lib/hyperdht_static.lib
          # DLL + its import lib (linker stub)
          Copy-Item build-shared/hyperdht.dll dist/lib/
          Copy-Item build-shared/hyperdht.lib dist/lib/
          New-Item -ItemType Directory -Force -Path dist/licenses/libuv | Out-Null
          Copy-Item deps/libuv/LICENSE, deps/libuv/LICENSE-extra dist/licenses/libuv/
          Copy-Item -Recurse "$env:LIBUV_PREFIX/include/*" dist/include/
          Copy-Item "$env:LIBUV_PREFIX/lib/libuv.lib" dist/lib/
          New-Item -ItemType Directory -Force -Path dist/licenses/libsodium | Out-Null
          Copy-Item deps/libsodium/LICENSE, .github/licenses/libsodium-source-notices.txt dist/licenses/libsodium/
          Copy-Item -Recurse "$env:SODIUM_PREFIX/include/*" dist/include/
          Copy-Item "$env:SODIUM_PREFIX/lib/libsodium.lib" dist/lib/
          # Headers
          Copy-Item -Recurse include/hyperdht dist/include/
          # Zip up
          Compress-Archive -Path dist/* -DestinationPath hyperdht-x86_64-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdht-x86_64-windows
          path: hyperdht-x86_64-windows.zip
